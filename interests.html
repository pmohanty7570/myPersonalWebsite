<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interests | Pratyush Mohanty</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>

  <div class="theme-panel">
    <h3>Theme</h3>
    <label for="bgColor">Background</label>
    <input type="color" id="bgColor" value="#0b0b0b" onchange="changeBackgroundColor(this.value)">

    <label for="textColor">Text</label>
    <input type="color" id="textColor" value="#eeeeee" onchange="changeTextColor(this.value)">
  </div>

  <header class="navbar">
    <div class="logo">PRATYUSH</div>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="interests.html">Interests</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <section id="interests" class="interests page-section">
    <h2>Interests</h2>
    <p>I like spending time on things that are useful, interesting, or just fun to keep working on. Whether it’s a school project, a new skill, or a sport, I usually enjoy the process of getting better.</p>

    <div class="interest-boxes">
      <div class="box" onmouseover="highlightBox(this)" onmouseout="unhighlightBox(this)">Nature</div>
      <div class="box" onmouseover="highlightBox(this)" onmouseout="unhighlightBox(this)">Bioengineering</div>
      <div class="box" onmouseover="highlightBox(this)" onmouseout="unhighlightBox(this)">Table Tennis</div>
    </div>
  </section>

</body>
</html>
